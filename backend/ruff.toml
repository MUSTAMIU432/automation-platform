# Ruff is the single Python linter, import sorter and formatter for the backend.
# Run from backend/:  ruff check .  |  ruff format --check .  |  ruff format .

target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*"]

[format]
# Matches the existing codebase (single quotes; docstrings stay double-quoted).
quote-style = "single"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports/variables, undefined names
    "I",    # isort: import sorting
    "B",    # flake8-bugbear: likely bugs
    "UP",   # pyupgrade: modern Python syntax
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "C90",  # mccabe complexity (see [lint.mccabe])
    "DJ",   # flake8-django
    "PT",   # flake8-pytest-style
    "S",    # flake8-bandit: security
    "T20",  # flake8-print: no stray print()
    "RUF",  # Ruff-specific rules
]

[lint.mccabe]
max-complexity = 10

[lint.isort]
known-first-party = ["config", "graphql_api"]

[lint.per-file-ignores]
# pytest tests rely on bare `assert`.
"tests/**" = ["S101"]
