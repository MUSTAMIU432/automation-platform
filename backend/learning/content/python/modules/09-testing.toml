explanation = "pytest.raises is a context manager that fails the test unless the block raises that exception."

[[quiz.questions]]
prompt = "What is a fixture for?"
options = [
  "Fixing failing tests automatically",
  "Providing fresh setup that tests request by name",
  "Running tests in parallel",
  "Formatting test code",
]
correct = [1]
explanation = "A fixture builds setup (data, temporary directories, clients) for each test that asks for it, keeping tests isolated."

