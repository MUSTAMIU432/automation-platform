options = ["A tuple of extra positional arguments", "A dictionary of extra keyword arguments", "A list", "A required parameter"]
correct = [1]
explanation = "**kwargs collects extra keyword arguments into a dictionary; *args collects positional ones into a tuple."

[[quiz.questions]]
