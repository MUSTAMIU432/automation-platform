call = '''
first = add_student([], "A")
second = add_student([], "B")
first[0]["marks"].append(50)
print(second[0]["marks"])
'''
expected = "[]"
hidden = true

[[exercises.tests]]
name = "Empty list and ties"
call = '''
print(top_student([]))
print(top_student([{"name": "X", "marks": [80]}, {"name": "Y", "marks": [80]}]))
'''
expected = "None\nX"
hidden = true

