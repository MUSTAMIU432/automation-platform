[[quiz.questions]]
prompt = "Why is def add(item, items=[]) a problem?"
options = [
  "Lists cannot be default values",
  "The same list is shared by every call that uses the default",
  "It is slower than using None",
  "There is no problem",
]
correct = [1]
explanation = "A default is evaluated once, when the function is defined. Use None and create a new list inside."

