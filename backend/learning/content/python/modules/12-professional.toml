[[lessons]]
slug = "architecture-environments-config"
title = "Architecture, environments, dependencies and configuration"
summary = "Organising a growing codebase, reproducible environments, and configuration that keeps secrets out of code."
minutes = 40
objectives = [
  "Separate an application into layers with clear responsibilities",
  "Create virtual environments and pin dependencies",
  "Load typed configuration from the environment and fail fast",
]
body = '''
## Application architecture

As a project grows, put each kind of responsibility in its own place. A common,
practical layering:

- **Interface** - HTTP routes, GraphQL resolvers or a command-line interface. Translates requests in and responses out; holds no business rules.
- **Services** - the business rules: "a course may not be over capacity", "only the owner may delete". Plain Python, easy to test.
- **Data access** - queries and persistence, behind functions or repositories.
- **Configuration** - read once at startup, passed to whatever needs it.

```text
course_service/
    pyproject.toml
    src/course_service/
        api.py          # routes only
        services.py     # rules
        repository.py   # database access
        settings.py     # configuration
    tests/
```

Each layer depends only on the ones below it, so you can test the rules without a
web server and replace the database without touching the rules.

## Virtual environments and dependencies

A **virtual environment** gives each project its own Python packages, so two
projects never fight over versions:

```text
$ python3 -m venv .venv
$ source .venv/bin/activate        # Windows: .venv\Scripts\activate
$ pip install fastapi psycopg[binary]
$ pip freeze > requirements.txt
```

**Pin** exact versions (`fastapi==0.115.6`) for applications, so every install -
your laptop, CI, production - gets the same code. Upgrade deliberately, with tests,
rather than by accident. Tools such as uv, pip-tools and Poetry manage pinning and
lock files for you. Never commit `.venv/`.

## Configuration and secrets

Follow the **twelve-factor** rule: configuration that differs between environments
comes from **environment variables**. Read it in one place, convert and validate
it, and refuse to start when something required is missing:

```python
import os
from dataclasses import dataclass

@dataclass(frozen=True)
class Settings:
    database_url: str
    debug: bool
    page_size: int

def load_settings() -> Settings:
    try:
        database_url = os.environ["DATABASE_URL"]
    except KeyError:
        raise RuntimeError("DATABASE_URL must be set") from None
    return Settings(
        database_url=database_url,
        debug=os.environ.get("DEBUG", "false").lower() == "true",
        page_size=int(os.environ.get("PAGE_SIZE", "20")),
    )
```

Failing at startup with a clear message is far better than failing on the first
request that needs the missing value. Keep secrets in the deployment platform's
secret settings or a secret manager; commit only a `.env.example` with placeholders.
'''

[[lessons]]
slug = "logging-docker-deployment"
title = "Logging, background work, Docker, deployment, security and profiling"
summary = "Running a service in production: observable, containerised, deployed safely, secure and fast enough."
minutes = 50
objectives = [
  "Emit structured logs",
  "Explain when work belongs in the background",
  "Write a Dockerfile for a Python service",
  "Describe a safe deployment, core security practices and how to profile",
  "Document a project so others can run it",
]
body = '''
## Structured logging

In production, logs are searched by machines. **Structured logs** - one JSON
object per line - make every field searchable:

```python
import json
import logging

class JsonFormatter(logging.Formatter):
    def format(self, record: logging.LogRecord) -> str:
        entry = {"level": record.levelname, "logger": record.name, "message": record.getMessage()}
        if hasattr(record, "request_id"):
            entry["request_id"] = record.request_id
        return json.dumps(entry)

handler = logging.StreamHandler()
handler.setFormatter(JsonFormatter())
logger = logging.getLogger("courses")
logger.addHandler(handler)
logger.setLevel(logging.INFO)
logger.info("Course created", extra={"request_id": "req-42"})
```

Log to standard output and let the platform collect it. Include identifiers that
connect related lines (a request id), and never log secrets or personal data you do
not need.

## Background processing

A web request should finish in well under a second. Slow or unreliable work -
sending email, generating a report, calling a slow API - belongs in the
**background**: the request records a job and returns, and a separate **worker**
process performs it. Celery, RQ and Dramatiq are common job queues, usually with
Redis. Background jobs must be safe to **retry**, because workers crash and
networks fail.

## Docker

A **container** packages your code with its exact runtime, so it runs the same
everywhere. A small, production-minded Dockerfile:

```dockerfile
FROM python:3.12-slim
ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY . .
RUN useradd --create-home app
USER app
CMD ["gunicorn", "course_service.wsgi", "--bind", "0.0.0.0:8000"]
```

Copying `requirements.txt` before the code lets Docker reuse the dependency layer
when only code changes; running as a non-root user limits what a compromised
process can do.

## Deployment fundamentals

A platform such as Render, Fly.io or a cloud provider builds your code, sets the
environment variables, runs database **migrations**, and starts the service behind
HTTPS. A safe deployment process:

- every change is reviewed and passes CI (tests, linting) before it can ship;
- configuration and secrets are set in the platform, never in the repository;
- migrations are backward compatible, so the old and new code can briefly run side by side;
- a **health check** endpoint tells the platform when the new version is ready;
- you can roll back quickly, and you watch the logs after each release.

## Security principles

- **Least privilege** - every user, service and database role gets only the access it needs.
- **Validate at every boundary** - requests, files, environment variables, other services' responses.
- **Defence in depth** - several independent protections, so one mistake is not a breach.
- **Keep dependencies updated** and scan them for known vulnerabilities (for example with pip-audit).
- **Never trust the client** - authorization is decided on the server, every time.

## Profiling

Measure before optimising. `cProfile` shows where time actually goes:

```python
import cProfile
import pstats

def slow_report():
    return sorted(str(n) for n in range(200_000))

profiler = cProfile.Profile()
profiler.enable()
slow_report()
profiler.disable()
pstats.Stats(profiler).sort_stats("cumulative").print_stats(5)
```

The fix is usually a better data structure or algorithm, a database index, or
avoiding repeated work - rarely a clever trick.

## Documentation and maintainability

A project is finished when someone else can run it. Its **README** says what it
does, how to install, configure, run and test it, and what each environment
variable means. Docstrings explain intent; a short design document or decision
record explains *why* the important choices were made. Consistent formatting,
tests and small, reviewed changes keep the codebase easy to change long after you
wrote it.
'''

[[exercises]]
slug = "settings-loader"
title = "Fail-fast configuration"
lesson = "architecture-environments-config"
difficulty = "medium"
instructions = '''
Write `load_settings(environ)`, where `environ` is a dictionary like `os.environ`.
Return a dictionary with:

- `database_url` - from `DATABASE_URL`, **required**; it must start with `postgresql://` or `postgres://`.
- `debug` - from `DEBUG`: `True` only for `"1"`, `"true"` or `"yes"` (any case); default `False`.
- `page_size` - from `PAGE_SIZE`, an integer from 1 to 100; default `20`.

Collect **every** problem before failing, then raise `ValueError` with the problems
joined by `"; "`, in this order and wording:

- `DATABASE_URL is required` or `DATABASE_URL must be a PostgreSQL URL`
- `PAGE_SIZE must be a whole number from 1 to 100`

Never include the database URL's value in an error message - it contains a password.
'''
starter = '''
def load_settings(environ: dict[str, str]) -> dict:
    problems = []
    ...
'''
solution = '''
def load_settings(environ: dict[str, str]) -> dict:
    problems = []

    database_url = environ.get("DATABASE_URL", "").strip()
    if not database_url:
        problems.append("DATABASE_URL is required")
    elif not database_url.startswith(("postgresql://", "postgres://")):
        problems.append("DATABASE_URL must be a PostgreSQL URL")

    debug = environ.get("DEBUG", "").strip().lower() in ("1", "true", "yes")

    page_size = 20
    raw_size = environ.get("PAGE_SIZE")
    if raw_size is not None:
        try:
            page_size = int(raw_size)
        except ValueError:
            page_size = 0
        if not 1 <= page_size <= 100:
            problems.append("PAGE_SIZE must be a whole number from 1 to 100")

    if problems:
        raise ValueError("; ".join(problems))
    return {"database_url": database_url, "debug": debug, "page_size": page_size}
'''
hints = [
  "str.startswith accepts a tuple: url.startswith((\"postgresql://\", \"postgres://\")).",
  "Append each problem to a list, and raise once at the end if the list is not empty.",
  "Treat a PAGE_SIZE that int() cannot parse the same as one out of range.",
]

[[exercises.tests]]
name = "Defaults"
call = "print(load_settings({'DATABASE_URL': 'postgresql://u:p@db/app'}))"
expected = "{'database_url': 'postgresql://u:p@db/app', 'debug': False, 'page_size': 20}"

[[exercises.tests]]
name = "Every problem at once, without the secret"
call = '''
try:
    load_settings({"DATABASE_URL": "mysql://user:s3cret@db/app", "PAGE_SIZE": "lots"})
except ValueError as error:
    print(error)
    print("s3cret" in str(error))
'''
expected = "DATABASE_URL must be a PostgreSQL URL; PAGE_SIZE must be a whole number from 1 to 100\nFalse"
hidden = true

[[exercises.tests]]
name = "Values are converted"
call = '''
print(load_settings({"DATABASE_URL": "postgres://db/app", "DEBUG": "YES", "PAGE_SIZE": "50"}))
try:
    load_settings({"PAGE_SIZE": "0"})
except ValueError as error:
    print(error)
'''
expected = "{'database_url': 'postgres://db/app', 'debug': True, 'page_size': 50}\nDATABASE_URL is required; PAGE_SIZE must be a whole number from 1 to 100"
hidden = true

[quiz]
title = "Professional Python Projects"
pass_percentage = 70

[[quiz.questions]]
prompt = "Why pin exact dependency versions in an application?"
options = [
  "It makes installs faster",
  "So every environment installs exactly the same code",
  "Pinned packages are more secure automatically",
  "pip requires it",
]
correct = [1]
explanation = "Pinning makes builds reproducible; you upgrade on purpose, with tests, instead of by surprise."

[[quiz.questions]]
prompt = "Where should slow work such as sending a batch of emails run?"
options = [
  "Inside the web request, so the user waits for it",
  "In a background worker, triggered by a job the request records",
  "In the browser",
  "In a database trigger",
]
correct = [1]
explanation = "Background workers keep requests fast and can retry work that fails."

[[quiz.questions]]
prompt = "Why copy requirements.txt and install dependencies before copying the rest of the code in a Dockerfile?"
options = [
  "Docker requires that order",
  "So the dependency layer is reused when only the code changes",
  "To make the image smaller",
  "To avoid running as root",
]
correct = [1]
explanation = "Docker caches each layer; dependencies change rarely, so installing them first makes rebuilds fast."

[[quiz.questions]]
prompt = "Which are sound security practices? Choose every one."
kind = "multiple"
options = [
  "Give each service only the access it needs",
  "Decide authorization on the server for every request",
  "Hide the admin page by giving it an unusual URL instead of checking permissions",
  "Scan dependencies for known vulnerabilities",
]
correct = [0, 1, 3]
explanation = "An obscure URL is not access control - anyone who finds it gets in. Check permissions on the server."

[[quiz.questions]]
prompt = "What should you do before optimising code for speed?"
options = ["Rewrite it in C", "Measure where the time goes, for example with cProfile", "Remove all comments", "Add caching everywhere"]
correct = [1]
explanation = "Profile first; the bottleneck is rarely where you expect."
