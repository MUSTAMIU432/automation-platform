[[lessons]]
slug = "sql-fundamentals"
title = "Relational concepts, SQL and database design"
summary = "Tables and keys, the SQL you will use every day, and designing tables that keep data consistent."
minutes = 45
objectives = [
  "Describe tables, primary keys and foreign keys",
  "Write CREATE, INSERT, SELECT, UPDATE and DELETE statements",
  "Join tables and aggregate with GROUP BY",
  "Use constraints and normalise a schema",
]
body = '''
## Relational databases

A **relational database** stores data in **tables**. Each **row** is one record and
each **column** one attribute. A **primary key** uniquely identifies each row; a
**foreign key** points at a row in another table, which is how tables relate.
**SQL** (Structured Query Language) is how you define and query them. PostgreSQL,
MySQL and SQLite all speak it, with small differences.

## Creating tables, with constraints

```sql
CREATE TABLE students (
    id SERIAL PRIMARY KEY,
    email TEXT NOT NULL UNIQUE,
    full_name TEXT NOT NULL
);

CREATE TABLE courses (
    id SERIAL PRIMARY KEY,
    code TEXT NOT NULL UNIQUE,
    title TEXT NOT NULL,
    capacity INTEGER NOT NULL CHECK (capacity > 0)
);

CREATE TABLE enrollments (
    student_id INTEGER NOT NULL REFERENCES students(id) ON DELETE CASCADE,
    course_id INTEGER NOT NULL REFERENCES courses(id),
    enrolled_on DATE NOT NULL DEFAULT CURRENT_DATE,
    PRIMARY KEY (student_id, course_id)
);
```

**Constraints** make the database refuse bad data, whatever code wrote it:
`NOT NULL`, `UNIQUE`, `CHECK`, and `REFERENCES` (a foreign key). The composite
primary key on `enrollments` makes enrolling the same student twice impossible.

## CRUD

The four basic operations - **C**reate, **R**ead, **U**pdate, **D**elete:

```sql
INSERT INTO students (email, full_name) VALUES ('amina@example.com', 'Amina Juma');

SELECT full_name, email FROM students WHERE email LIKE '%@example.com' ORDER BY full_name;

UPDATE courses SET capacity = 40 WHERE code = 'CS101';

DELETE FROM enrollments WHERE student_id = 1 AND course_id = 2;
```

> An `UPDATE` or `DELETE` without a `WHERE` changes **every** row. Write the
> `WHERE` first.

## Joins and aggregates

A **join** combines rows from related tables. `GROUP BY` with an aggregate such as
`COUNT`, `SUM` or `AVG` summarises groups of rows:

```sql
SELECT c.code, c.title, COUNT(e.student_id) AS enrolled
FROM courses AS c
LEFT JOIN enrollments AS e ON e.course_id = c.id
GROUP BY c.id, c.code, c.title
HAVING COUNT(e.student_id) < c.capacity
ORDER BY enrolled DESC;
```

`LEFT JOIN` keeps courses with no enrollments (counting 0); an inner `JOIN` would
drop them. `HAVING` filters groups the way `WHERE` filters rows.

## Designing and normalising

**Normalisation** means storing each fact exactly once. If a `registrations` table
repeated the course title on every row, renaming a course would mean updating many
rows - and missing one leaves the data contradicting itself. Instead, split
repeated facts into their own table and refer to them by key, as `enrollments`
refers to `courses`. The common rules of thumb:

- every column holds a single value, not a list (first normal form);
- every non-key column describes the whole key, not part of it (second);
- non-key columns do not depend on other non-key columns (third).

## Transactions

A **transaction** groups statements so they all succeed or none do. Moving money
between accounts must never debit one without crediting the other:

```sql
BEGIN;
UPDATE accounts SET balance = balance - 500 WHERE id = 1;
UPDATE accounts SET balance = balance + 500 WHERE id = 2;
COMMIT;   -- or ROLLBACK; to undo both
```
'''

