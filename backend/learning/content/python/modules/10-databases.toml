title = "PostgreSQL from Python, SQL injection and ORMs"
summary = "Connecting with psycopg, running queries safely with parameters, and what ORMs and migrations add."
minutes = 40
objectives = [
  "Connect to PostgreSQL with psycopg and run queries",
  "Use transactions from Python",
  "Explain and prevent SQL injection",
  "Explain what an ORM and migrations do",
]
body = '''
## Connecting with psycopg

**psycopg** (version 3) is the standard PostgreSQL driver for Python - it is what
this platform's own backend uses. Install it with `pip install "psycopg[binary]"`.
Read the connection string from the environment, never from source code:

```python
import os
import psycopg

with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
    with connection.cursor() as cursor:
        cursor.execute(
            "SELECT id, full_name FROM students WHERE email = %s",
            ("amina@example.com",),
        )
        row = cursor.fetchone()
        print(row)
```

Leaving the `with connection` block **commits** the transaction if it finished
cleanly, and **rolls it back** if an exception escaped - so a half-finished
group of changes is never saved.

## SQL injection

Never build SQL by pasting user input into a string:

```python
# DANGEROUS - never do this
email = "x' OR '1'='1"
query = f"SELECT * FROM students WHERE email = '{email}'"
print(query)   # the input has rewritten the query to match every student
```

That is **SQL injection**: input becomes part of the SQL itself. An attacker can
read, change or delete data they should never touch. The fix is **parameterised
queries**: write placeholders (`%s` in psycopg, `?` in sqlite3) and pass the values
separately. The driver sends them as data, so they can never change the query:

```python
import sqlite3

connection = sqlite3.connect(":memory:")
connection.execute("CREATE TABLE students (email TEXT, full_name TEXT)")
connection.execute("INSERT INTO students VALUES (?, ?)", ("amina@example.com", "Amina"))

email = "x' OR '1'='1"
rows = connection.execute("SELECT * FROM students WHERE email = ?", (email,)).fetchall()
print(rows)   # [] - the input was treated as an ordinary string
```

Placeholders work for **values** only. If a table or column name must vary, choose
it from a fixed allow-list in your code.

## ORMs and migrations

An **ORM** (object-relational mapper) such as SQLAlchemy or Django's ORM maps tables
to classes and rows to objects, and writes parameterised SQL for you:

```python
# Django ORM - the same query as above, safely parameterised
# Student.objects.filter(email="amina@example.com").first()
```

ORMs save a lot of repetitive code and make injection hard to introduce by
accident. You still need to understand the SQL they generate - to keep queries
efficient and to avoid the "N+1" problem of one extra query per row in a loop.

A **migration** is a versioned, repeatable change to the schema - add a table, add a
column, add a constraint. Tools such as Alembic and Django's `makemigrations` and
`migrate` create and apply them, so every environment's database ends up with
exactly the same structure.
'''

[[exercises]]
slug = "course-registration"
title = "Safe course registration"
lesson = "python-and-postgresql"
difficulty = "hard"
instructions = '''
Using `sqlite3` (the same ideas as PostgreSQL, in memory), write a small
registration data layer. A connection and these tables are created for you:

```sql
courses(code TEXT PRIMARY KEY, capacity INTEGER NOT NULL)
enrollments(student TEXT, code TEXT, PRIMARY KEY (student, code))
```

Write `enroll(connection, student, code)`, which returns a string:

- `"enrolled"` - the student was added to the course;
- `"no such course"` - the code does not exist;
- `"already enrolled"` - the student is already in that course;
- `"full"` - the course has reached its capacity.

Use **parameterised queries only** (`?` placeholders) - a hidden test tries SQL
injection. Write `roster(connection, code)` returning the course's students as a
sorted list.
'''
starter = '''
import sqlite3


def setup():
    connection = sqlite3.connect(":memory:")
    connection.execute("CREATE TABLE courses (code TEXT PRIMARY KEY, capacity INTEGER NOT NULL)")
    connection.execute(
        "CREATE TABLE enrollments (student TEXT, code TEXT, PRIMARY KEY (student, code))"
    )
    return connection


def enroll(connection, student, code):
    ...


def roster(connection, code):
    ...
'''
solution = '''
import sqlite3


def setup():
    connection = sqlite3.connect(":memory:")
    connection.execute("CREATE TABLE courses (code TEXT PRIMARY KEY, capacity INTEGER NOT NULL)")
    connection.execute(
        "CREATE TABLE enrollments (student TEXT, code TEXT, PRIMARY KEY (student, code))"
    )
    return connection


def enroll(connection, student, code):
    course = connection.execute("SELECT capacity FROM courses WHERE code = ?", (code,)).fetchone()
    if course is None:
        return "no such course"
    taken = connection.execute(
        "SELECT COUNT(*) FROM enrollments WHERE code = ?", (code,)
    ).fetchone()[0]
    try:
        with connection:
            if taken >= course[0]:
                existing = connection.execute(
                    "SELECT 1 FROM enrollments WHERE student = ? AND code = ?", (student, code)
                ).fetchone()
                return "already enrolled" if existing else "full"
            connection.execute(
                "INSERT INTO enrollments (student, code) VALUES (?, ?)", (student, code)
            )
    except sqlite3.IntegrityError:
        return "already enrolled"
    return "enrolled"


def roster(connection, code):
    rows = connection.execute(
        "SELECT student FROM enrollments WHERE code = ? ORDER BY student", (code,)
    )
    return [student for (student,) in rows]
'''
hints = [
  "Look the course up first: SELECT capacity FROM courses WHERE code = ?",
  "The primary key on (student, code) raises sqlite3.IntegrityError on a duplicate - catch it.",
  "Compare SELECT COUNT(*) of the course's enrollments with its capacity.",
]

