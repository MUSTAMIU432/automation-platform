call = '''
db = setup()
db.execute("INSERT INTO courses VALUES ('CS101', 2)")
print(enroll(db, "amina", "CS101"), enroll(db, "amina", "CS101"), enroll(db, "juma", "MA200"))
'''
expected = "enrolled already enrolled no such course"

[[exercises.tests]]
name = "Capacity and roster"
call = '''
db = setup()
db.execute("INSERT INTO courses VALUES ('CS101', 2)")
print([enroll(db, s, "CS101") for s in ("neema", "baraka", "zuri")])
print(roster(db, "CS101"))
'''
expected = "['enrolled', 'enrolled', 'full']\n['baraka', 'neema']"
hidden = true

[[exercises.tests]]
name = "SQL injection is just a strange name"
call = '''
db = setup()
db.execute("INSERT INTO courses VALUES ('CS101', 5)")
print(enroll(db, "x'); DELETE FROM courses; --", "CS101"))
print(enroll(db, "amina", "CS101' OR '1'='1"))
print(db.execute("SELECT COUNT(*) FROM courses").fetchone()[0], roster(db, "CS101"))
'''
expected = "enrolled\nno such course\n1 [\"x'); DELETE FROM courses; --\"]"
hidden = true

