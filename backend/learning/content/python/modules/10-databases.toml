[[quiz.questions]]
prompt = "What does a foreign key do?"
options = [
  "Encrypts a column",
  "Refers to a row in another table, so related rows stay consistent",
  "Makes a column unique",
  "Speeds up every query",
]
correct = [1]
explanation = "A foreign key references another table's key; the database refuses values that point at nothing."

[[quiz.questions]]
prompt = "Which query is safe from SQL injection?"
options = [
  "cursor.execute(f\"SELECT * FROM users WHERE name = '{name}'\")",
  "cursor.execute(\"SELECT * FROM users WHERE name = '\" + name + \"'\")",
  "cursor.execute(\"SELECT * FROM users WHERE name = %s\", (name,))",
  "cursor.execute(\"SELECT * FROM users WHERE name = %s\" % name)",
]
correct = [2]
explanation = "Only the parameterised form sends the value separately from the SQL. Formatting the value into the string - with f-strings, + or % - is injectable."

[[quiz.questions]]
prompt = "What does a transaction guarantee?"
options = [
  "Queries run faster",
  "Its statements all take effect, or none of them do",
  "Data is backed up",
  "Only one user can connect",
]
correct = [1]
explanation = "A transaction is atomic: COMMIT applies every change; ROLLBACK, or an error, applies none."

[[quiz.questions]]
prompt = "A LEFT JOIN from courses to enrollments…"
options = [
  "Drops courses with no enrollments",
  "Keeps every course, with NULLs where there is no matching enrollment",
  "Returns only enrollments",
  "Is the same as an inner JOIN",
]
correct = [1]
explanation = "A LEFT JOIN keeps every row of the left table even without a match."

[[quiz.questions]]
prompt = "What is the goal of normalisation?"
options = [
  "Store each fact exactly once, so data cannot contradict itself",
  "Put all data in one table",
  "Make every column a number",
  "Remove primary keys",
]
correct = [0]
explanation = "Normalisation removes duplicated facts by splitting them into related tables."
