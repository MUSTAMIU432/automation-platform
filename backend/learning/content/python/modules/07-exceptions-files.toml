result = import_expenses(text)
print(result["errors"])
print(result["imported"])
'''
expected = "['line 2: missing category', 'line 3: invalid amount', 'line 4: invalid amount', 'line 5: invalid amount']\n[{'date': '2025-01-07', 'category': 'data', 'amount': 99.0}]"
hidden = true

