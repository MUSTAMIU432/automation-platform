[[quiz.questions]]
prompt = "What does this print?"
code = '''
def make_counter():
    count = 0
    def increment():
        nonlocal count
        count += 1
        return count
    return increment

counter = make_counter()
counter()
print(counter())
'''
options = ["0", "1", "2", "An error"]
correct = [2]
explanation = "The closure keeps count between calls; nonlocal lets it update the enclosing variable. The second call returns 2."

