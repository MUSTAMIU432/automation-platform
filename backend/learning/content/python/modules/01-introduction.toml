[[quiz.questions]]
prompt = "What does Python use to group statements into a block, such as the body of an if?"
options = ["Curly braces { }", "Indentation", "The keywords begin and end", "Semicolons"]
correct = [1]
explanation = "Python uses indentation - conventionally four spaces - to show which statements belong to a block."

[[quiz.questions]]
prompt = "What does this print if the user types 5?"
code = '''
x = input()
print(x * 2)
'''
options = ["10", "55", "An error", "5 5"]
correct = [1]
explanation = "input() returns the string '5', and multiplying a string by 2 repeats it: '55'."

[[quiz.questions]]
prompt = "Which of these are valid, conventional Python variable names? Choose every one."
kind = "multiple"
options = ["total_price", "2nd_place", "user_name", "first-name"]
correct = [0, 2]
explanation = "Names cannot start with a digit or contain hyphens. snake_case names such as total_price follow PEP 8."

[[quiz.questions]]
prompt = "When reading a traceback, where do you find the type of error and its message?"
options = ["The first line", "The last line", "The middle", "Python does not say"]
correct = [1]
explanation = "Read tracebacks bottom-up: the last line names the exception, such as ZeroDivisionError: division by zero."

[[quiz.questions]]
prompt = "How is a constant written in Python, by convention?"
options = ["const RATE = 0.18", "RATE = 0.18", "final rate = 0.18", "rate := 0.18"]
correct = [1]
explanation = "Python has no constant keyword; an UPPER_CASE name signals a value that should not change."
