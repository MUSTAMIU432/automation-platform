[[lessons]]
slug = "classes-and-objects"
title = "Classes, objects, encapsulation and properties"
summary = "Bundling data and behaviour into classes, protecting an object's state, and computed attributes."
minutes = 40
objectives = [
  "Define a class with __init__, attributes and methods",
  "Explain the difference between a class and an instance",
  "Protect invariants with encapsulation and properties",
  "Use class methods, static methods and special methods",
]
body = '''
## Classes and objects

A **class** is a blueprint; an **object** (an *instance*) is one thing built from
it. The class defines what data each object holds - its **attributes** - and what
it can do - its **methods**.

```python
class BankAccount:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self.balance = balance

    def deposit(self, amount):
        self.balance += amount

account = BankAccount("Amina", 100)
account.deposit(50)
print(account.owner, account.balance)   # Amina 150
```

`__init__` is the **constructor**: Python calls it when you create an object.
`self` is the object the method is working on - Python passes it automatically,
so `account.deposit(50)` runs `deposit(account, 50)`.

## Encapsulation

**Encapsulation** means an object protects its own state, so it can never be put
into an invalid condition from outside. A leading underscore marks an attribute as
internal by convention, and methods enforce the rules:

```python
class BankAccount:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self._balance = balance

    def withdraw(self, amount):
        if amount <= 0:
            raise ValueError("Withdraw a positive amount.")
        if amount > self._balance:
            raise ValueError("Insufficient funds.")
        self._balance -= amount

    @property
    def balance(self):
        return self._balance
```

A **property** looks like an attribute (`account.balance`) but runs a method.
With only a getter it is read-only, so the only way to change the balance is
through `deposit` and `withdraw`, which check the rules. That is **abstraction**:
callers use a simple interface without knowing - or being able to break - the
details behind it.

## Class methods and static methods

A `@classmethod` receives the class instead of an instance, and is commonly used
as an alternative constructor. A `@staticmethod` receives neither; it is a plain
function that belongs with the class for organisation:

```python
class Temperature:
    def __init__(self, celsius):
        self.celsius = celsius

    @classmethod
    def from_fahrenheit(cls, fahrenheit):
        return cls((fahrenheit - 32) * 5 / 9)

    @staticmethod
    def is_freezing(celsius):
        return celsius <= 0

t = Temperature.from_fahrenheit(212)
print(t.celsius, Temperature.is_freezing(t.celsius))   # 100.0 False
```

## Special methods

Methods with double underscores - "dunder" methods - let your objects work with
Python's built-in operations:

```python
class Playlist:
    def __init__(self, name, songs):
        self.name = name
        self.songs = list(songs)

    def __len__(self):
        return len(self.songs)

    def __str__(self):
        return f"{self.name} ({len(self)} songs)"

    def __repr__(self):
        return f"Playlist({self.name!r}, {self.songs!r})"

    def __eq__(self, other):
        return isinstance(other, Playlist) and self.songs == other.songs

mix = Playlist("Road trip", ["Malaika", "Jambo"])
print(len(mix), str(mix))
print(repr(mix))
```

`__str__` is for people; `__repr__` is for developers and should ideally look like
the code that recreates the object.
'''

