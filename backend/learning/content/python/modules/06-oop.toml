[[lessons]]
slug = "inheritance-composition-design"
title = "Inheritance, polymorphism, composition, dataclasses and SOLID"
summary = "Reusing and extending classes, choosing between inheritance and composition, and principles for designs that last."
minutes = 45
objectives = [
  "Extend a class with inheritance and call the parent with super()",
  "Use polymorphism to treat different objects the same way",
  "Choose composition over inheritance where it fits",
  "Write dataclasses",
  "Explain each SOLID principle with an example",
]
body = '''
## Inheritance

A **subclass** inherits everything from its **base class** and can add to it or
**override** it. `super()` calls the base class's version:

```python
class Employee:
    def __init__(self, name, salary):
        self.name = name
        self.salary = salary

    def annual_pay(self):
        return self.salary * 12

class Manager(Employee):
    def __init__(self, name, salary, bonus):
        super().__init__(name, salary)
        self.bonus = bonus

    def annual_pay(self):
        return super().annual_pay() + self.bonus

print(Manager("Neema", 2000, 5000).annual_pay())   # 29000
```

## Polymorphism

**Polymorphism** means different classes respond to the same method call in their
own way, so code can work with any of them without checking which it has:

```python
class Shape:
    def area(self):
        raise NotImplementedError

class Square(Shape):
    def __init__(self, side):
        self.side = side

    def area(self):
        return self.side ** 2

class Circle(Shape):
    def __init__(self, radius):
        self.radius = radius

    def area(self):
        return 3.14159 * self.radius ** 2

shapes = [Square(2), Circle(1)]
print([round(shape.area(), 2) for shape in shapes])   # [4, 3.14]
```

## Composition

Inheritance models **is-a** relationships (a manager *is an* employee).
**Composition** models **has-a** relationships: an object holds other objects and
delegates work to them. Composition is usually more flexible, because parts can be
swapped without a class hierarchy:

```python
class Engine:
    def start(self):
        return "Engine running"

class Car:
    def __init__(self, engine):
        self.engine = engine          # a Car has an Engine

    def drive(self):
        return f"{self.engine.start()} - driving"

print(Car(Engine()).drive())
```

Prefer composition unless the subclass truly is a specialised kind of its base.

## Dataclasses

For classes that mostly hold data, `@dataclass` writes `__init__`, `__repr__` and
`__eq__` for you:

```python
from dataclasses import dataclass, field

@dataclass
class Book:
    title: str
    author: str
    copies: int = 1
    tags: list[str] = field(default_factory=list)

book = Book("Things Fall Apart", "Chinua Achebe")
print(book)
print(book == Book("Things Fall Apart", "Chinua Achebe"))   # True
```

Use `@dataclass(frozen=True)` for objects that should never change after creation.

## SOLID

Five principles for object-oriented designs that stay easy to change:

- **Single responsibility** - a class has one reason to change. A `ReportGenerator` should not also send emails.
- **Open/closed** - extend behaviour by adding code (a new `Shape` subclass), not by editing working code.
- **Liskov substitution** - a subclass must work anywhere its base class does, without surprises.
- **Interface segregation** - depend on small, focused interfaces rather than one large one.
- **Dependency inversion** - depend on abstractions: pass a `Car` its engine rather than having it build a specific one.

They are guidelines, not laws. Apply them when a design starts to resist change.
'''

[[exercises]]
slug = "library-system"
title = "Library loans"
lesson = "inheritance-composition-design"
difficulty = "medium"
instructions = '''
Build the core of a library system.

`Book` holds a `title` and a number of `copies` (default 1).

`Library` keeps books by title and tracks loans:

- `add_book(book)` adds a book, or adds its copies to a book with the same title.
- `borrow(member, title)` lends one copy to `member` (a string). Raise
  `ValueError("No such book")` for an unknown title and
  `ValueError("No copies available")` when every copy is out. A member may not
  borrow two copies of the same title: raise `ValueError("Already borrowed")`.
- `return_book(member, title)` returns that member's copy, or raises
  `ValueError("Not borrowed")`.
- `available(title)` returns how many copies are on the shelf.
- `loans_for(member)` returns the sorted list of titles that member has borrowed.
'''
starter = '''
class Book:
    def __init__(self, title, copies=1):
        self.title = title
        self.copies = copies


class Library:
    def __init__(self):
        self.books = {}
        self.loans = []  # (member, title) pairs

    def add_book(self, book):
        ...

    def borrow(self, member, title):
        ...

    def return_book(self, member, title):
        ...

    def available(self, title):
        ...

    def loans_for(self, member):
        ...
'''
solution = '''
class Book:
    def __init__(self, title, copies=1):
        self.title = title
        self.copies = copies


class Library:
    def __init__(self):
        self.books = {}
        self.loans = []

    def add_book(self, book):
        if book.title in self.books:
            self.books[book.title].copies += book.copies
        else:
            self.books[book.title] = book

    def borrow(self, member, title):
        if title not in self.books:
            raise ValueError("No such book")
        if (member, title) in self.loans:
            raise ValueError("Already borrowed")
        if self.available(title) == 0:
            raise ValueError("No copies available")
        self.loans.append((member, title))

    def return_book(self, member, title):
        if (member, title) not in self.loans:
            raise ValueError("Not borrowed")
        self.loans.remove((member, title))

    def available(self, title):
        out = sum(1 for _, borrowed in self.loans if borrowed == title)
        return self.books[title].copies - out

    def loans_for(self, member):
        return sorted(title for who, title in self.loans if who == member)
'''
hints = [
  "Store loans as (member, title) tuples; `in` then answers \"has this member borrowed this title?\".",
  "available() is the book's copies minus the loans of that title.",
  "Check the error conditions in the order the instructions list them.",
]

