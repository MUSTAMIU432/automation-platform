[[lessons]]
slug = "conditionals"
title = "Making decisions: if, elif and else"
summary = "Running code only when a condition holds, and choosing between several paths."
minutes = 25
objectives = [
  "Write if, elif and else chains",
  "Order conditions so the right branch runs",
  "Use conditional expressions for simple choices",
]
body = '''
## if

An `if` statement runs its block only when its condition is truthy:

```python
balance = 120
price = 80

if balance >= price:
    balance -= price
    print("Purchase complete.")
print(f"Balance: {balance}")
```

## elif and else

`elif` ("else if") adds more conditions; `else` catches everything left over.
Python checks the conditions **top to bottom** and runs only the **first** block
whose condition is true:

```python
temperature = 24

if temperature >= 30:
    advice = "Stay in the shade."
elif temperature >= 20:
    advice = "A perfect day."
elif temperature >= 10:
    advice = "Bring a jacket."
else:
    advice = "It is cold - dress warmly."

print(advice)
```

Because only the first match runs, order matters: if `>= 10` came first, a
24-degree day would get the jacket advice.

## Nested conditions

A block can contain another `if`. Keep nesting shallow - two levels is usually
the most a reader can follow; beyond that, combine conditions with `and` or split
the work into functions:

```python
is_member = True
total = 150

if total >= 100:
    if is_member:
        discount = 0.15
    else:
        discount = 0.05
else:
    discount = 0

print(f"Discount: {discount:.0%}")
```

## Conditional expressions

For a simple choice between two values, a **conditional expression** fits on one line:

```python
age = 16
status = "adult" if age >= 18 else "minor"
print(status)
```

## match (Python 3.10+)

When one value is compared against several literal options, `match` can read
more clearly than a long `elif` chain:

```python
command = "stop"

match command:
    case "start":
        print("Starting.")
    case "stop" | "quit":
        print("Stopping.")
    case _:
        print("Unknown command.")
```
'''

[[lessons]]
slug = "loops"
title = "Loops: for, while, break and continue"
summary = "Repeating work over a sequence or until a condition changes, and validating input."
minutes = 35
objectives = [
  "Loop over sequences and ranges with for",
  "Loop until a condition changes with while",
  "Use break, continue and pass correctly",
  "Write nested loops and an input-validation loop",
]
body = '''
## for loops

A `for` loop runs its block once for each item in a sequence:

```python
for city in ["Dodoma", "Mwanza", "Arusha"]:
    print(f"Visiting {city}")
```

`range()` produces numbers: `range(5)` is 0 to 4, `range(1, 6)` is 1 to 5, and
`range(0, 10, 2)` counts in steps of 2. When you need the position too, use
`enumerate()` rather than counting yourself:

```python
total = 0
for n in range(1, 6):
    total += n
print(total)   # 15

for index, fruit in enumerate(["mango", "banana"], start=1):
    print(index, fruit)
```

## while loops

A `while` loop repeats as long as its condition is true. Use it when you do not
know in advance how many times to repeat:

```python
balance = 1000
years = 0
while balance < 2000:
    balance *= 1.08
    years += 1
print(f"Doubled after {years} years")
```

Make sure something inside the loop eventually makes the condition false - or
the loop never ends.

## break, continue and pass

- `break` leaves the loop immediately.
- `continue` skips the rest of this iteration and moves to the next.
- `pass` does nothing; it holds a place where Python needs a statement.

```python
for n in range(1, 20):
    if n % 2 == 0:
        continue          # skip even numbers
    if n > 9:
        break             # stop once past 9
    print(n, end=" ")     # 1 3 5 7 9
print()
```

## Nested loops

A loop inside a loop runs the inner loop completely for each pass of the outer one:

```python
for row in range(1, 4):
    line = ""
    for col in range(1, 4):
        line += f"{row * col:4}"
    print(line)
```

## Validating input

A `while True` loop with `break` keeps asking until the input is acceptable:

```python
while True:
    text = input("Enter your age: ")
    if text.isdigit() and 0 < int(text) < 130:
        age = int(text)
        break
    print("Please enter a whole number between 1 and 129.")

print(f"Thanks - you are {age}.")
```
'''

[[exercises]]
slug = "fizzbuzz"
title = "FizzBuzz"
lesson = "loops"
difficulty = "easy"
instructions = '''
Read a whole number `n`. Print the numbers from 1 to `n`, one per line, except:

- for multiples of 3, print `Fizz` instead of the number;
- for multiples of 5, print `Buzz`;
- for multiples of both 3 and 5, print `FizzBuzz`.
'''
starter = '''
n = int(input())
'''
solution = '''
n = int(input())

for i in range(1, n + 1):
    if i % 15 == 0:
        print("FizzBuzz")
    elif i % 3 == 0:
        print("Fizz")
    elif i % 5 == 0:
        print("Buzz")
    else:
        print(i)
'''
hints = [
  "range(1, n + 1) goes from 1 up to and including n.",
  "Check for multiples of both 3 and 5 first - otherwise 15 would print Fizz.",
]

