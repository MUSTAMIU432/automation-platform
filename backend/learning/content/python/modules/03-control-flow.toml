[[exercises]]
slug = "guessing-game"
title = "Number-guessing game"
lesson = "loops"
difficulty = "medium"
instructions = '''
Build the core of a guessing game. The first input line is the **secret**
number. Every line after it is one **guess**. For each guess, print:

- `Too low` if it is below the secret,
- `Too high` if it is above it,
- `Correct! Guesses: N` (N counts valid guesses) when it matches - then stop reading.

If a line is not a whole number, print `Please enter a whole number.` - it does
not count as a guess. There is always a correct guess eventually.
'''
starter = '''
secret = int(input())
'''
solution = '''
secret = int(input())
guesses = 0

while True:
    text = input().strip()
    if not text.lstrip("-").isdigit():
        print("Please enter a whole number.")
        continue
    guesses += 1
    guess = int(text)
    if guess < secret:
        print("Too low")
    elif guess > secret:
        print("Too high")
    else:
        print(f"Correct! Guesses: {guesses}")
        break
'''
hints = [
  "Use while True: and break out of the loop on the correct guess.",
  "str.isdigit() tells you whether a string is made only of digits - check before calling int().",
  "Only count a guess after you know it is a valid number.",
]

